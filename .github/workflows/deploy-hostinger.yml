name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Create SMTP config
        run: |
          cat > dist/api/smtp-config.php <<'PHP'
          <?php
          return [
              'host' => 'smtp.hostinger.com',
              'port' => 465,
              'encryption' => 'ssl',
              'username' => 'info@tacadvisors.com.co',
              'password' => '${{ secrets.HOSTINGER_SMTP_PASSWORD }}',
              'from_email' => 'info@tacadvisors.com.co',
              'from_name' => 'TAC ADVISORS',
              'to_email' => 'info@tacadvisors.com.co',
          ];
          PHP

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
